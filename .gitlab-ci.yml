stages: [test, build]
linux-tests:
 stage: test
 image: gcc:14
 before_script:
  - apt-get update -qq && apt-get install -y -qq cmake
 script:
  - cmake -S . -B build
  - cmake --build build
  - ctest --test-dir build --output-on-failure
windows-mingw:
 stage: build
 image: debian:bookworm
 before_script:
  - apt-get update -qq && apt-get install -y -qq cmake g++-mingw-w64-x86-64
 script:
  - cmake -S . -B build-win -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
  - cmake --build build-win --target synchrorep
 artifacts:
  paths: [build-win/synchrorep.exe]
