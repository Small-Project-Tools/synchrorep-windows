stages: [test, build]
linux-tests:
 stage: test
 image: gcc:14
 before_script:
  - apt-get update -qq
  - apt-get install -y -qq cmake libcurl4-openssl-dev python3 python3-pyftpdlib python3-paramiko
 script:
  - cmake -S . -B build-remote -DSYNCHROREP_REMOTE=ON -DCMAKE_BUILD_TYPE=Debug
  - cmake --build build-remote --parallel
  - ctest --test-dir build-remote --output-on-failure
  - bash tests/integration/run.sh
windows-mingw:
 stage: build
 image: debian:bookworm
 before_script:
  - apt-get update -qq && apt-get install -y -qq cmake g++-mingw-w64-x86-64
 script:
  # This cross-built artifact supports local and WSL UNC paths only.
  # To include FTP/SFTP build with MSVC and vcpkg curl[ssh].
  - cmake -S . -B build-win -DSYNCHROREP_REMOTE=OFF -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
  - cmake --build build-win --target synchrorep engine_tests --parallel
 artifacts:
  paths: [build-win/synchrorep.exe]
