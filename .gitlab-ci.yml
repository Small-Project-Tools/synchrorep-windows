stages: [test, build, verify]
linux-tests:
 stage: test
 image: gcc:14
 before_script:
  - apt-get update -qq
  - apt-get install -y -qq cmake libcurl4-openssl-dev python3 python3-pyftpdlib python3-paramiko
 script:
  - cmake -S . -B build-remote -DSYNCHROREP_REMOTE=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=-Wall\ -Wextra\ -Wpedantic\ -Werror
  - cmake --build build-remote --parallel
  - ctest --test-dir build-remote --output-on-failure
  - python3 tests/installer_manifest_test.py
  - python3 tests/sparse_manifest_test.py
  - bash tests/integration/run.sh
windows-mingw:
 stage: build
 image: debian:bookworm
 before_script:
  - apt-get update -qq && apt-get install -y -qq cmake g++-mingw-w64-x86-64-posix wixl python3
 script:
  # This cross-built artifact supports local and WSL UNC paths only.
  # To include FTP/SFTP build with MSVC and vcpkg curl[ssh].
  - cmake -S . -B build-win -DSYNCHROREP_REMOTE=OFF -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++-posix
  - cmake --build build-win --target synchrorep engine_tests sha256_tests profiles_tests recovery_tests recovery_catalog_tests recycle_bin_tests mirror_tests startup_tests startup_registry_tests windows_args_tests synchrorep_explorer_command explorer_command_tests --parallel
  - x86_64-w64-mingw32-objdump -p build-win/synchrorep.exe | grep 'DLL Name'
  - x86_64-w64-mingw32-objdump -p build-win/SynchrorepExplorer.dll | grep 'DllGetClassObject'
  - x86_64-w64-mingw32-objdump -p build-win/SynchrorepExplorer.dll | grep 'DllCanUnloadNow' 
  - wixl -a x64 -D SourceExe=build-win/synchrorep.exe -D SourceExplorerDll=build-win/SynchrorepExplorer.dll -D SourceLicense=LICENSE -o build-win/synchrorep-windows-0.12.1-lite-x64.msi windows/installer/Synchrorep-Lite.wxs
  - python3 tests/lite_installer_test.py
 artifacts:
  paths: [build-win/synchrorep.exe, build-win/SynchrorepExplorer.dll, build-win/startup_registry_tests.exe, build-win/recovery_tests.exe, build-win/synchrorep-windows-0.12.1-lite-x64.msi]

# Optional: requires an authorized Windows runner with VS C++ and vcpkg.
# It does not block the standard pipeline when no such runner exists.
windows-msvc-full:
 stage: build
 tags: [windows]
 when: manual
 allow_failure: true
 script:
  - cmake -S . -B build-msvc -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DSYNCHROREP_REMOTE=ON
  - cmake --build build-msvc --config Release --parallel
  - ctest --test-dir build-msvc -C Release --output-on-failure
  - if (-not (Get-Command wix -ErrorAction SilentlyContinue)) { dotnet tool install --global wix --version '5.*' }
  - $env:PATH = "$env:USERPROFILE\.dotnet\tools;$env:PATH"
  - wix build -arch x64 "-dSourceExe=build-msvc/Release/synchrorep.exe" "-dSourceExplorerDll=build-msvc/Release/SynchrorepExplorer.dll" "-dSourceLicense=LICENSE" windows/installer/Synchrorep.wxs -o synchrorep-windows-0.12.1-x64.msi
 artifacts:
  paths: [build-msvc/Release/synchrorep.exe, build-msvc/Release/SynchrorepExplorer.dll, synchrorep-windows-0.12.1-x64.msi]

windows-sparse-unsigned:
 stage: build
 tags: [windows]
 when: manual
 allow_failure: true
 script:
  - cmake -S . -B build-msvc -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DSYNCHROREP_REMOTE=ON
  - cmake --build build-msvc --config Release --parallel
  - ./windows/sparse/package.ps1 -ApplicationDirectory "build-msvc/Release" -Output "Synchrorep.Windows.0.12.1.sparse-unsigned.msix"
 artifacts:
  paths: [Synchrorep.Windows.0.12.1.sparse-unsigned.msix]


# Optional Wine integration validates the actual Windows executable and its
# HKCU startup keys, but never touches a real Windows user's registry.
windows-wine-smoke:
 stage: verify
 image: debian:bookworm
 needs:
  - job: windows-mingw
    artifacts: true
 allow_failure: true
 before_script:
  - apt-get update -qq
  - apt-get install -y -qq wine wine64 xvfb
 script:
  - export WINEPREFIX="$CI_PROJECT_DIR/wine-ci"
  - export WINEDEBUG=-all
  - xvfb-run -a wineboot -u
  - xvfb-run -a wine build-win/startup_registry_tests.exe
  - xvfb-run -a wine build-win/recovery_tests.exe
  - xvfb-run -a wine msiexec /i build-win/synchrorep-windows-0.12.1-lite-x64.msi /qn
  - export SYNCHROREP_EXE="$WINEPREFIX/drive_c/Program Files/Synchrorep/synchrorep.exe"
  - test -f "$SYNCHROREP_EXE"
  - cmp build-win/synchrorep.exe "$SYNCHROREP_EXE"
  - xvfb-run -a bash tests/wine_autostart_smoke.sh
  - xvfb-run -a wine msiexec /x build-win/synchrorep-windows-0.12.1-lite-x64.msi /qn
  - test ! -e "$SYNCHROREP_EXE"
