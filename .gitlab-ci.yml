stages: [test, build]
linux-tests:
 stage: test
 image: gcc:14
 before_script:
  - apt-get update -qq
  - apt-get install -y -qq cmake libcurl4-openssl-dev python3 python3-pyftpdlib python3-paramiko
 script:
  - cmake -S . -B build-remote -DSYNCHROREP_REMOTE=ON -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS=-Wall\ -Wextra\ -Wpedantic\ -Werror
  - cmake --build build-remote --parallel
  - ctest --test-dir build-remote --output-on-failure
  - bash tests/integration/run.sh
windows-mingw:
 stage: build
 image: debian:bookworm
 before_script:
  - apt-get update -qq && apt-get install -y -qq cmake g++-mingw-w64-x86-64-posix
 script:
  # This cross-built artifact supports local and WSL UNC paths only.
  # To include FTP/SFTP build with MSVC and vcpkg curl[ssh].
  - cmake -S . -B build-win -DSYNCHROREP_REMOTE=OFF -DCMAKE_SYSTEM_NAME=Windows -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++-posix
  - cmake --build build-win --target synchrorep engine_tests sha256_tests profiles_tests recovery_tests --parallel
  - x86_64-w64-mingw32-objdump -p build-win/synchrorep.exe | grep 'DLL Name' 
 artifacts:
  paths: [build-win/synchrorep.exe]

# Optional: requires an authorized Windows runner with VS C++ and vcpkg.
# It does not block the standard pipeline when no such runner exists.
windows-msvc-full:
 stage: build
 tags: [windows]
 when: manual
 allow_failure: true
 script:
  - cmake -S . -B build-msvc -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static -DSYNCHROREP_REMOTE=ON
  - cmake --build build-msvc --config Release --parallel
  - ctest --test-dir build-msvc -C Release --output-on-failure
 artifacts:
  paths: [build-msvc/Release/synchrorep.exe]
