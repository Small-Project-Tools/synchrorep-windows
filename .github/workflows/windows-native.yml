name: Windows native validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Windows native / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-2025]
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows-static
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare vcpkg
        run: |
          if (-not $env:VCPKG_INSTALLATION_ROOT) { throw 'VCPKG_INSTALLATION_ROOT is undefined' }
          $vcpkg = Join-Path $env:VCPKG_INSTALLATION_ROOT 'vcpkg.exe'
          if (-not (Test-Path $vcpkg)) {
            & (Join-Path $env:VCPKG_INSTALLATION_ROOT 'bootstrap-vcpkg.bat') -disableMetrics
            if ($LASTEXITCODE -ne 0) { throw 'vcpkg bootstrap failed' }
          }
          & $vcpkg install --classic --triplet x64-windows-static 'curl[ssl,ssh]' sqlite3
          if ($LASTEXITCODE -ne 0) { throw 'vcpkg install failed' }

      - name: Configure MSVC build
        run: |
          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT 'scripts/buildsystems/vcpkg.cmake'
          cmake -S . -B build-msvc -G 'Visual Studio 17 2022' -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            '-DVCPKG_TARGET_TRIPLET=x64-windows-static' `
            '-DVCPKG_MANIFEST_MODE=OFF' `
            '-DSYNCHROREP_REMOTE=ON'
          if ($LASTEXITCODE -ne 0) { throw 'CMake configure failed' }

      - name: Build application and test targets
        run: |
          cmake --build build-msvc --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'MSVC compilation failed' }

      - name: Verify native binaries
        run: |
          $exe = 'build-msvc/Release/synchrorep.exe'
          $explorer = 'build-msvc/Release/SynchrorepExplorer.dll'
          foreach ($file in @($exe, $explorer)) {
            if (-not (Test-Path $file)) { throw "Missing expected binary: $file" }
            Get-FileHash $file -Algorithm SHA256 | Format-List
          }
          & $exe --check-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Runtime self-check failed' }

      - name: Execute native CTest suite
        run: |
          ctest --test-dir build-msvc -C Release --output-on-failure --timeout 120
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows tests failed' }

      - name: Preserve diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: native-test-diagnostics-${{ matrix.os }}
          path: |
            build-msvc/CMakeFiles/CMakeConfigureLog.yaml
            build-msvc/CMakeFiles/CMakeOutput.log
            build-msvc/CMakeFiles/CMakeError.log
            build-msvc/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  msi-smoke:
    name: GitLab MSI installation / Windows 2025
    if: ${{ vars.SYNCHROREP_MSI_CI_ENABLED == 'true' }}
    runs-on: windows-2025
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download GitLab CI MSI for checked-out version
        shell: pwsh
        env:
          GITLAB_ARTIFACT_TOKEN: ${{ secrets.GITLAB_ARTIFACT_TOKEN }}
        run: |
          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'project\(synchrorep_windows VERSION (\d+\.\d+\.\d+)') {
            throw 'Cannot determine Synchrorep version'
          }
          $version = $Matches[1]
          $filename = "synchrorep-windows-$version-x64.msi"
          $url = "https://git.small-project.dev/api/v4/projects/665/jobs/artifacts/main/raw/build-win/$filename?job=windows-mingw"
          $target = Join-Path $env:RUNNER_TEMP 'synchrorep.msi'
          $headers = @{}
          if ($env:GITLAB_ARTIFACT_TOKEN) { $headers['PRIVATE-TOKEN'] = $env:GITLAB_ARTIFACT_TOKEN }
          try {
            Invoke-WebRequest -Uri $url -Headers $headers -OutFile $target -MaximumRedirection 3
          } catch {
            throw "GitLab MSI artifact download failed. Check CI artifact permissions and SYNCHROREP_MSI_CI_ENABLED: $($_.Exception.Message)"
          }
          $item = Get-Item $target
          if ($item.Length -lt 100000) { throw "MSI is missing or suspiciously small ($($item.Length) bytes)" }
          $firstBytes = [IO.File]::ReadAllBytes($target)[0..7]
          if ([Convert]::ToHexString($firstBytes) -ne 'D0CF11E0A1B11AE1') { throw 'Downloaded artifact is not an MSI' }
          Write-Output "MSI $filename downloaded; SHA256:"
          Get-FileHash $target -Algorithm SHA256 | Format-List
      - name: Install, verify and uninstall MSI
        shell: pwsh
        run: |
          ./scripts/test_windows_msi.ps1 -MsiPath "$env:RUNNER_TEMP/synchrorep.msi"
      - name: Preserve installer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-msi-install-logs
          path: ${{ runner.temp }}/synchrorep-msi-logs/
          if-no-files-found: ignore
          retention-days: 7
